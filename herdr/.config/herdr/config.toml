# Tmux-mirrored Herdr configuration.
# Bindings below intentionally follow tmux defaults where Herdr has an equivalent.
onboarding = false

[theme]
# Use the host terminal's ANSI palette, as in the tmux status line.
name = "gruvbox"
# auto_switch = true

# [theme.custom]
# Subtle contrast between the Spaces/Agents sidebar and terminal panes.
# sidebar_bg = "#3c3836"

[terminal]
default_shell = ""
shell_mode = "auto"
new_cwd = "follow"

[keys]
# tmux-style prefix, using my preferred Ctrl+E instead of tmux default Ctrl+B.
prefix = "ctrl+e"
help = "prefix+?"
detach = "prefix+d"
copy_mode = "prefix+["

# Workspaces are Herdr's closest analogue to tmux sessions.
workspace_picker = "prefix+s"
new_workspace = "prefix+ctrl+c"
rename_workspace = "prefix+shift+4"
previous_workspace = "prefix+shift+9"
next_workspace = "prefix+shift+0"

# Tabs are Herdr's closest analogue to tmux windows.
new_tab = "prefix+c"
rename_tab = "prefix+comma"
previous_tab = "prefix+p"
next_tab = "prefix+n"
switch_tab = "prefix+1..9"
close_tab = "prefix+ampersand"

# Panes: tmux default creation, navigation, closing, last-pane, and zoom keys.
split_vertical = "prefix+percent"
split_horizontal = "prefix+double_quote"

focus_pane_down = ["prefix+down", "prefix+ctrl+j", "ctrl+j"]
focus_pane_up = ["prefix+up", "prefix+ctrl+k", "ctrl+k"]
focus_pane_right = ["prefix+right", "prefix+ctrl+l", "ctrl+l"]
focus_pane_left = ["prefix+left", "prefix+ctrl+h", "ctrl+h"]
cycle_pane_next = "prefix+o"
last_pane = "prefix+semicolon"
close_pane = "prefix+x"
zoom = "prefix+z"

# Herdr-only actions kept off tmux defaults unless they have a common tmux-ish binding.
reload_config = "prefix+r"
resize_mode = "prefix+ctrl+r"
rename_pane = "prefix+shift+p"
edit_scrollback = "prefix+e"
toggle_sidebar = "prefix+b"

# Navigate mode also uses Vim directions inside Herdr's UI.
navigate_workspace_up = "up"
navigate_workspace_down = "down"
navigate_pane_left = "h"
navigate_pane_down = "j"
navigate_pane_up = "k"
navigate_pane_right = "l"

# Workspace picker via fzf, shown as a popup overlay.
[[keys.command]]
key = "prefix+j"
type = "popup"
command = "/home/latent/dotfiles/herdr/.config/herdr/bin/herdr-workspace-fzf"
description = "pick workspace with fzf"
width = "40%"
height = "40%"

# LazyGit popup overlay.
[[keys.command]]
key = "prefix+ctrl+g"
type = "popup"
command = "lazygit"
description = "open lazygit"
width = "100%"
height = "100%"

[ui]
mouse_capture = true
copy_on_select = true
confirm_close = true
prompt_new_tab_name = false
prompt_new_workspace_name = true
pane_borders = true
pane_outer_borders = false
pane_scrollbars = false
pane_gaps = false
tab_bar_position = "bottom"
accent = "blue"

agent_panel_sort = "spaces"
[ui.toast]
delivery = "herdr"
delay_seconds = 1

[session]
resume_agents_on_restore = true

[experimental]
pane_history = false

[advanced]
# Herdr measures scrollback in bytes; 10 MB is its closest analogue to 10k lines.
scrollback_limit_bytes = 10000000
