# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Configure the format
# Git branch and status are displayed in tmux, not in the shell prompt.
format = """$directory\
$character"""

add_newline = false

# Show paths relative to the Git root, shortening deep paths by component.
[directory]
format = "[$path]($style) "
style = "bold #83a598"
truncate_to_repo = true
truncation_length = 3
truncation_symbol = ""

# Git branch configuration - Gruvbox purple
[git_branch]
format = "[\\($branch\\)]($style) "
style = "bold #d3869b"

# Git status configuration - Gruvbox orange/yellow with Nerd Font icons
[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "bold #fabd2f"
modified = "󰷉"
deleted = ""
untracked = "󱪠"
staged = ""
renamed = "󰁕"
stashed = "󰏖"
conflicted = ""
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
disabled = false

# Character (prompt symbol) - Gruvbox green/red
[character]
success_symbol = "[%](bold #b8bb26)"
error_symbol = "[%](bold #fb4934)"
