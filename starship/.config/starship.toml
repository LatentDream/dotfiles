# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Configure the format
format = """${custom.path}\
$character"""
# $git_status\

add_newline = false

# Directory configuration - Gruvbox blue. Starship's directory truncation is
# component-based, so use a custom module to cap the rendered path at 32 chars
# with a single-character ellipsis.
[custom.path]
command = '''python3 -c 'import os; p = os.getcwd(); h = os.path.expanduser("~"); p = "~" + p[len(h):] if p == h or p.startswith(h + os.sep) else p; print(p if len(p) <= 32 else "…" + p[-31:])' '''
format = "[$output]($style) "
style = "bold #83a598"
when = "true"

# Git branch configuration - Gruvbox purple
# [git_branch]
# format = "[\\(](bold #d3869b)[$branch](bold #d3869b)[\\)](bold #d3869b)"

# Git status configuration - Gruvbox orange/yellow with Nerd Font icons
# [git_status]
# format = '([\[$all_status$ahead_behind\]](bold #fabd2f))'
# modified = "󰷉"
# deleted = ""
# untracked = "󱪠"
# staged = ""
# renamed = "󰁕"
# stashed = "󰏖"
# conflicted = ""
# ahead = "⇡${count}"
# behind = "⇣${count}"
# diverged = "⇕⇡${ahead_count}⇣${behind_count}"
# disabled = false

# Character (prompt symbol) - Gruvbox green/red
[character]
success_symbol = "[%](bold #b8bb26)"
error_symbol = "[%](bold #fb4934)"
